name: 24-7 Render Keep-Alive

on:
  schedule:
    # Runs every 14 minutes (Render spins down after 15-30 min idle)
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Send Keepalive Ping to Render Relay
        run: |
          echo "Sending keep-alive ping to https://psitunnel.onrender.com/..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://psitunnel.onrender.com/ || echo "failed")
          echo "Render HTTP Status: $HTTP_STATUS"
          echo "Render relay is awake and active!"
